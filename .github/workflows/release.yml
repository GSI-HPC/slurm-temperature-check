# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, spec and CHANGELOG must agree
        run: ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"

  rpm:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rockylinux/rockylinux:9
      # --privileged solely so the offline-build proof (`unshare -n`) can
      # create a network namespace inside the container.
      options: --privileged
    steps:
      # The image ships without git. Without it actions/checkout silently
      # falls back to downloading a repository tarball, which leaves no .git
      # directory and makes the action's `git archive HEAD` fail.
      - name: Install git for checkout
        run: dnf -y install git-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rpm-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms
          path: rpm-artifacts/

  release:
    needs: rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          # The body of the newest entry: from its "## [x.y.z]" heading up to
          # the next "## [" heading or the link reference block.
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[/) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "no CHANGELOG entry body for $version" >&2; exit 1; }
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "slurm-temperature-check ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*
