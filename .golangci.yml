version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert
    - usetesting

  settings:
    errcheck:
      # Writing the program's own output to stdout or stderr: if that write
      # fails there is nowhere left to report it, and the exit status already
      # carries the verdict. Every other unchecked return stays an error.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln

    revive:
      rules:
        # Every exported identifier in this tree is documented; keep it that
        # way, since the packages are the specification of a safety device.
        - name: exported
        - name: error-strings
        - name: error-return
        - name: context-as-argument

formatters:
  enable:
    - gofmt
    - goimports
