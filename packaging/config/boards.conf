# SPDX-License-Identifier: Apache-2.0
#
# Which sensor slurm-temperature-check watches on a given mainboard, and how
# hot that sensor may get before the node stops running jobs.
#
# One section per mainboard. The section header is matched against the DMI
# board name exactly as the kernel reports it:
#
#     cat /sys/devices/virtual/dmi/id/board_name
#
# A node whose board is not listed here refuses to start the guard, which
# arms the emergency stop. Add the board before the node is put into service.
#
# Keys:
#
#   chip         Which hwmon chips to read. Either a full name as printed by
#                `slurm-temperature-check --list` ("k10temp-pci-00c3", one
#                chip) or a bare driver prefix ("k10temp", every chip of that
#                driver). The prefix form watches all sockets of a
#                multi-socket node and compares the hottest of them.
#
#   sensor       Optional. A driver label ("Tctl", matched without regard to
#                case) or an attribute name ("temp1"). Omitted, it selects the
#                lowest-numbered temperature attribute of each matched chip,
#                which is the first reading `sensors` prints for that chip.
#
#   max_celsius  The limit. A reading strictly above it stops the node.
#                Fractions are allowed and the comparison is exact: with a
#                limit of 85, a reading of 85.001 C trips.
#
# Run `slurm-temperature-check --list` on the node to see the chip names,
# labels and current readings as this program computes them, and
# `slurm-temperature-check --check` to resolve this file against the node
# and take one reading without starting the guard.

# --- Supermicro ------------------------------------------------------------

[H11DSi-NT]
chip = k10temp-pci-00c3
sensor = Tctl
max_celsius = 85

[H12DSi-N6]
chip = k10temp-pci-00cb
sensor = Tctl
max_celsius = 85

[H12DSG-O-CPU]
chip = i350bb
max_celsius = 75

# --- Xfusion ---------------------------------------------------------------

[BC11SPSCA0]
chip = coretemp-isa-0000
sensor = Package id 0
max_celsius = 90

[BC15MASA]
chip = i350bb
max_celsius = 75

# --- Gigabyte --------------------------------------------------------------

[MZB3-PE0-000]
chip = k10temp-pci-00c3
sensor = Tctl
max_celsius = 78

# --- Dell ------------------------------------------------------------------

# Watched on the DIMM SPD hub rather than the CPU, so the limit is a memory
# limit and correspondingly lower.
[FRANMDCP07]
chip = spd5118-i2c-20-50
max_celsius = 60

# --- Verification ----------------------------------------------------------

# No real mainboard reports this name. It exists so the mechanism can be
# exercised end to end against a fabricated sysfs tree, which is what the
# package's install test does:
#
#   slurm-temperature-check --check \
#     --board-name-path=<tree>/board_name --hwmon.path=<tree>/class/hwmon
[TESTBOARD]
chip = k10temp
sensor = Tctl
max_celsius = 60
