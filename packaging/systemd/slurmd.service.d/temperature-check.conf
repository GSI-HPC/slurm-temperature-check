#
# Installed by slurm-temperature-check. Ordering only: at boot the guard is
# started and has taken its first reading before slurmd begins accepting work,
# so a node that is already too hot never gets a job in the first place.
#
# Deliberately not BindsTo=. Binding slurmd's lifecycle to the guard means
# every stop of the guard stops slurmd and kills the jobs with it, including
# the stops that happen during a package upgrade or while an operator is
# servicing a sensor. The coupling that matters runs the other way and only
# on failure, through OnFailure= in slurm-temperature-check.service, which
# leaves `systemctl restart slurmd` free of any effect on the guard.
#
# Do not edit this file; package upgrades replace it. Use
# `systemctl edit slurmd.service` for local overrides.

[Unit]
Wants=slurm-temperature-check.service
After=slurm-temperature-check.service
